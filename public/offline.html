<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b365d">
  <title>EduBuddy · Offline</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { --bg: #f4f4f5; --card: #fff; --text: #171717; --muted: #525252; --brand: #005a9c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --card: #171717; --text: #f5f5f5; --muted: #a3a3a3; --brand: #4d90e4; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 360px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 16px 0 6px; font-size: 20px; font-weight: 600; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    button { margin-top: 20px; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--brand); color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>EduBuddy needs the internet to show live attendance, fees and marks. Check your connection and try again.</p>
    <p lang="hi" style="margin-top:8px">इंटरनेट नहीं है। कनेक्शन जाँचें और फिर से कोशिश करें।</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
